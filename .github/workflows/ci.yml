# Name des Workflows, der in GitHub Actions angezeigt wird
name: MediTrack CI

# Definiert, wann die Pipeline ausgeführt wird
on:

  # Startet die Pipeline bei jedem Push auf den main-Branch
  push:
    branches:
      - main

  # Startet die Pipeline bei jedem Pull Request auf den main-Branch
  pull_request:
    branches:
      - main

# Verhindert unnötige Schreibberechtigungen
permissions:
  contents: read

# Definition der auszuführenden Jobs
jobs:

  # Job zum Bauen und Testen der Anwendung
  build-and-test:

    # GitHub stellt einen Ubuntu-Runner zur Verfügung
    runs-on: ubuntu-latest

    # Einzelne Schritte des Jobs
    steps:
    
      # Lädt den aktuellen Quellcode aus dem Repository
      - name: Checkout source code
        uses: actions/checkout@v7

      # Prüft, ob es sich um ein Maven-Projekt handelt
      - name: Check Maven project
        id: maven-project
        shell: bash
        run: |
          if [[ -f "pom.xml" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Installiert Java und aktiviert Maven-Cache nur für Maven-Projekte
      - name: Set up Java
        if: steps.maven-project.outputs.found == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      # Baut und testet das Maven-Projekt
      - name: Build and test with Maven
        if: steps.maven-project.outputs.found == 'true'
        run: mvn --batch-mode --no-transfer-progress clean verify
      
      # Lädt erzeugte JAR-Dateien hoch
      - name: Upload MediTrack artifact
        if: steps.maven-project.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meditrack-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
