# Name des Workflows, der in GitHub Actions angezeigt wird
name: MediTrack CI

# Definiert, wann die Pipeline ausgeführt wird
on:

  # Startet die Pipeline bei jedem Push auf den main-Branch
  push:
    branches:
      - main

  # Startet die Pipeline bei jedem Pull Request auf den main-Branch
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Definition der auszuführenden Jobs
jobs:

  # Job zum Bauen und Testen der Anwendung
  build-and-test:

    # GitHub stellt einen Ubuntu-Runner zur Verfügung
    runs-on: ubuntu-latest

    # Einzelne Schritte des Jobs
    steps:
    
      # Lädt den aktuellen Quellcode aus dem Repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # Installiert Java 17 und richtet die Java-Umgebung ein
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Führt den Build aus, wenn passende Build-Dateien vorhanden sind
      - name: Build and test
        run: |
          if [ -f pom.xml ]; then
            mvn clean verify
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            ./gradlew clean test
          else
            echo "No Maven or Gradle build files found. Skipping build-and-test step."
          fi

      # Speichert die erzeugte JAR-Datei als Build-Artefakt
      # Dadurch kann die Datei später heruntergeladen oder weiterverwendet werden
      - name: Upload MediTrack artifact
        uses: actions/upload-artifact@v4
        with:
          name: meditrack-jar
          path: target/*.jar
